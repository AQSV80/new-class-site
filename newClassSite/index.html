
<!DOCTYPE html>
<html lang="az" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="TK-121 Student Rating">

    <title>TK-121 — Student Rating</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background -->
    <div class="background" aria-hidden="true">
        <div class="background-glow background-glow--one"></div>
        <div class="background-glow background-glow--two"></div>
    </div>


    <!-- Main content -->
    <main class="container">

        <!-- Header -->
        <header class="header">

            <div class="brand">
                <div class="brand-icon">🏆</div>

                <div class="brand-info">
                    <h1 id="siteTitle">TK-121</h1>
                    <p id="siteSubtitle">
                        Gecə gündüz çalışaq – Birbirimizlə yarışaq
                    </p>
                </div>
            </div>

            <div class="header-controls">

                <nav class="language-switcher" aria-label="Language">
                    <button type="button" data-language="az">AZ</button>
                    <button type="button" data-language="ru">RU</button>
                    <button type="button" data-language="en">EN</button>
                    <button type="button" data-language="tr">TR</button>
                </nav>

                <button
                    type="button"
                    class="theme-button"
                    id="themeButton"
                    aria-label="Change theme">
                    🌓
                </button>

            </div>

        </header>


        <!-- Teacher -->
        <section class="section teacher-section">

            <h2 class="section-title" data-i="teacher">
                Teacher
            </h2>

            <button
                type="button"
                class="teacher-card"
                id="teacherOpen"
                aria-haspopup="dialog">

                <img
                    src="img/teacher-fuad.jpg"
                    alt="Qurbanov Fuad"
                    width="64"
                    height="64"
                    loading="lazy">

                <span class="teacher-info">
                    <strong>Qurbanov Fuad</strong>
                    <small>10.07.1958</small>
                    <span data-i="teacherRole"></span>
                </span>

                <span class="teacher-more" data-i="teacherMore">
                    More
                </span>

            </button>

        </section>


        <!-- Administrators -->
        <section class="section administrators-section">

            <h2 class="section-title" data-i="admins">
                Administrators
            </h2>

            <div class="administrators">

                <article class="administrator-card">
                    <img src="img/admin1.jpg"
                         alt=""
                         width="80"
                         height="80"
                         loading="lazy">

                    <strong id="adminName1"></strong>
                    <span data-i="head"></span>
                </article>

                <article class="administrator-card">
                    <img src="img/admin2.jpg"
                         alt=""
                         width="80"
                         height="80"
                         loading="lazy">

                    <strong id="adminName2"></strong>
                    <span data-i="admin"></span>
                </article>

                <article class="administrator-card">
                    <img src="img/admin3.jpg"
                         alt=""
                         width="80"
                         height="80"
                         loading="lazy">

                    <strong id="adminName3"></strong>
                    <span data-i="admin"></span>
                </article>

            </div>

        </section>


        <!-- Online compilers -->
        <section class="section compiler-section">

            <button
                type="button"
                class="compiler-toggle"
                id="compilerToggle"
                aria-expanded="false"
                aria-controls="compilerLinks">

                <span>⌨️</span>
                <span data-i="compiler">Online compiler</span>
                <span class="compiler-chevron">⌄</span>

            </button>

            <div class="compiler-links" id="compilerLinks" hidden>

                <a href="https://onecompiler.com/cpp"
                   target="_blank"
                   rel="noopener noreferrer">
                    C++
                </a>

                <a href="https://onecompiler.com/python"
                   target="_blank"
                   rel="noopener noreferrer">
                    Python
                </a>

            </div>

        </section>


        <!-- Rating navigation -->
        <section class="section rating-section">

            <nav class="rating-tabs" aria-label="Rating categories">

                <button
                    type="button"
                    class="tab active"
                    data-sheet="common"
                    aria-pressed="true"
                    data-i="common">
                    Common
                </button>

                <button
                    type="button"
                    class="tab"
                    data-sheet="python"
                    aria-pressed="false">
                    Python
                </button>

                <button
                    type="button"
                    class="tab"
                    data-sheet="cpp"
                    aria-pressed="false">
                    C++
                </button>

            </nav>


            <!-- Weekly achievements -->
            <nav class="weekly-tabs" aria-label="Weekly highlights">

                <button type="button" data-weekly="win">
                    🏆 <span data-i="win">Winners</span>
                </button>

                <button type="button" data-weekly="out">
                    🌧️ <span data-i="out">Out</span>
                </button>

            </nav>


            <!-- Statistics -->
            <div class="statistics">

                <article class="stat-card">
                    <span>👥</span>
                    <div>
                        <small data-i="total">Students</small>
                        <strong id="statTotal">—</strong>
                    </div>
                </article>

                <article class="stat-card">
                    <span>📊</span>
                    <div>
                        <small data-i="avg">Average</small>
                        <strong id="statAverage">—</strong>
                    </div>
                </article>

                <article class="stat-card">
                    <span>🕒</span>
                    <div>
                        <small data-i="upd">Updated</small>
                        <strong id="statUpdated">—</strong>
                    </div>
                </article>

            </div>


            <!-- Personal profile -->
            <section class="profile-launch">

                <div>
                    <span class="eyebrow">
                        TK-121 · PERSONAL STATS
                    </span>

                    <p data-i="profileLaunchHint">
                        Check your progress
                    </p>
                </div>

                <button
                    type="button"
                    id="profileOpen"
                    data-i="myProgress">
                    My progress
                </button>

            </section>


            <!-- Update notification -->
            <div
                class="update-toast"
                id="updateToast"
                role="status"
                aria-live="polite"
                hidden>
            </div>


            <!-- Rating table -->
            <section class="rating-board"
                     id="ratingBoard"
                     aria-label="Student rating">

                <!-- Generated by JavaScript -->

            </section>

        </section>

    </main>


    <!-- Modal overlay -->
    <div class="modal-overlay" id="modalOverlay" hidden></div>


    <!-- Student profile modal -->
    <section
        class="modal profile-modal"
        id="profileModal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="profileHeading"
        hidden>

        <button type="button"
                class="modal-close"
                id="profileClose"
                aria-label="Close">
            ×
        </button>

        <h2 id="profileHeading" data-i="profileTitle">
            Personal statistics
        </h2>

        <label for="profileSelect" data-i="chooseStudent">
            Choose student
        </label>

        <select id="profileSelect">
            <option value="" data-i="choosePlaceholder">
                Select student
            </option>
        </select>

        <div id="profileContent"></div>

    </section>


    <!-- Teacher information modal -->
    <section
        class="modal teacher-modal"
        id="teacherModal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="teacherName"
        hidden>

        <button type="button"
                class="modal-close"
                id="teacherClose"
                aria-label="Close">
            ×
        </button>

        <div class="teacher-modal-header">

            <img src="img/teacher-fuad.jpg"
                 alt="Qurbanov Fuad"
                 width="96"
                 height="96">

            <div>
                <h2 id="teacherName">Qurbanov Fuad</h2>
                <p data-i="teacherRole"></p>
                <p>🎂 10.07.1958</p>
            </div>

        </div>

        <h3 data-i="teacherEducation">Education</h3>
        <ul>
            <li data-i="teacherEdu1"></li>
            <li data-i="teacherEdu2"></li>
            <li data-i="teacherEdu3"></li>
        </ul>

        <h3 data-i="teacherWork">Work experience</h3>
        <ul>
            <li data-i="teacherWork1"></li>
            <li data-i="teacherWork2"></li>
            <li data-i="teacherWork3"></li>
            <li data-i="teacherWork4"></li>
        </ul>

    </section>


    <script src="app.js" defer></script>

</body>
</html>
